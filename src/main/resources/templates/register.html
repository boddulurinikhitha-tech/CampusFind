```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusFind - Register</title>
    <style>
        body {
            font-family: Arial;
            background: #eff6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 35px;
            width: 330px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #cbd5e1;
        }
        h2 { color: #2563eb; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        p { text-align: center; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Registration</h2>

    <p class="error" th:text="${error}"></p>

    <form action="/register" method="post">
        <input type="text" name="name"
               placeholder="Full Name" required>

        <input type="email" name="email"
               placeholder="Email Address" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <p>Already registered?
        <a href="/login">Login</a>
    </p>
</div>
</body>
</html>
